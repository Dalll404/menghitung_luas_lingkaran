<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="w-1/2 mx-auto mt-10 h-[90vh]">
      <div
        class="flex flex-col items-center justify-center h-full bg-gray-100 p-6 rounded-lg shadow-md"
      > 
      <h1 class="text-3xl font-medium">Menghitung Luas Lingkaran</h1>
        <div class="mt-4">
          <label for="radius" class="block text-gray-700 font-bold mb-2"
            >Masukkan jari-jari:</label
          >
          <input
            type="number"
            id="radius"
            class="border border-gray-300 rounded px-3 py-2 w-full"
            placeholder="Jari-jari"
          />
          <button
            onclick=calculateArea()
            class="bg-blue-500 text-white px-4 py-2 rounded mt-2 hover:bg-blue-600"
          >
            Hitung
          </button>
          <p id="result" class="mt-4 text-lg font-semibold"></p>
        </div>
      </div>
    </div>

    <script>
      function calculateArea() {
        const radiusInput = document.getElementById("radius");
        const resultElement = document.getElementById("result");
        const radius = parseFloat(radiusInput.value);

        if (isNaN(radius) || radius <= 0) {
          resultElement.textContent = "Masukkan jari-jari yang valid.";
          return;
        }

        const area = Math.PI * Math.pow(radius, 2);
        resultElement.textContent = `Luas lingkaran dengan jari-jari ${radius} adalah ${area.toFixed(2)}.`;
      }
    </script>
  </body>
</html>
